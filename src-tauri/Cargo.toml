[package]
name = "shortcut-cheatsheet"
version = "0.1.0"
description = "Displays keyboard shortcuts for the currently focused application"
authors = ["Philip"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shortcut_cheatsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the MCP bridge used by the integration tests. Never enabled for
# release builds.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
